# 可选对照（profile p2-kafka）；Python MVP 不依赖此文件
services:
  payment-mock:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -e . -q && payment-mock"
    ports:
      - "18080:18080"
    environment:
      PAYMENT_MOCK_HOST: 0.0.0.0
      PAYMENT_MOCK_PORT: "18080"

  postgres:
    image: postgres:16-alpine
    profiles: ["p2-postgres"]
    environment:
      POSTGRES_USER: multi
      POSTGRES_PASSWORD: multi
      POSTGRES_DB: multi_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multi -d multi_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    profiles: ["p2-kafka"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
    ports:
      - "9092:9092"