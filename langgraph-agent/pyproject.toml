[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-agent"
version = "0.1.0"
description = "LangGraph-based agent: StateGraph with LLM, tools, and conditional loop (CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pillow>=10.0.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]

[project.scripts]
agent = "agent.cli:app"
agent-serve = "agent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]